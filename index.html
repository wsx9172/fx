<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FX Flow — 汇率与换汇差额</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b1320'/><rect x='12' y='12' width='76' height='76' rx='12' fill='none' stroke='%233aa0ff' stroke-width='4'/><text x='50' y='60' text-anchor='middle' dominant-baseline='middle' font-size='48' fill='%235ad4ff' font-weight='bold'>¥$</text></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #071521;
      --bg-2: #0d1b2a;
      --panel: rgba(13, 27, 42, 0.92);
      --panel-strong: rgba(18, 34, 52, 0.95);
      --panel-alt: rgba(14, 25, 38, 0.9);
      --muted: #8aa0b7;
      --text: #edf6ff;
      --line: rgba(150, 175, 212, 0.2);
      --primary: #3aa0ff;
      --primary-2: #5ad4ff;
      --success: #1bc98e;
      --danger: #ff5c7a;
      --warning: #f6c453;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(58,160,255,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(90,212,255,0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
    }

    .page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      background: rgba(5, 14, 22, 0.8);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .topbar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 20px 12px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-left: calc(20px + env(safe-area-inset-left, 0px));
      padding-right: calc(20px + env(safe-area-inset-right, 0px));
      border-bottom: 1px solid var(--line);
      background: rgba(11, 19, 32, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(58,160,255,0.25), rgba(90,212,255,0.18));
      border: 1px solid rgba(90,212,255,0.2);
      box-shadow: 0 10px 24px rgba(58,160,255,0.2);
      font-size: 18px;
      font-weight: 700;
      color: #dff6ff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
    }

    .brand-mark:hover {
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 14px 28px rgba(58,160,255,0.26);
    }

    .brand-copy { min-width: 0; }

    .brand-label {
      white-space: nowrap;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .brand-title {
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .lang-picker {
      position: relative;
      z-index: 210;
    }

    .lang-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.02em;
      outline: none;
    }

    .lang-trigger:hover {
      border-color: rgba(90,212,255,0.4);
      background: rgba(90,212,255,0.06);
    }

    .lang-trigger:focus-visible {
      box-shadow: 0 0 0 2px rgba(58, 160, 255, 0.25);
    }

    .lang-trigger[aria-expanded="true"] {
      border-color: rgba(90,212,255,0.6);
      background: rgba(90,212,255,0.08);
      box-shadow: 0 0 0 2px rgba(58,160,255,0.14);
    }

    .lang-globe {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(90,212,255,0.7);
      position: relative;
      flex-shrink: 0;
    }
    .lang-globe::before,
    .lang-globe::after {
      content: '';
      position: absolute;
      background: rgba(90,212,255,0.7);
    }
    .lang-globe::before {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1.5px;
      transform: translateX(-50%);
      opacity: 0.7;
    }
    .lang-globe::after {
      top: 50%;
      left: 0;
      right: 0;
      height: 1.5px;
      transform: translateY(-50%);
      opacity: 0.7;
    }

    .lang-current { white-space: nowrap; }

    .lang-arrow {
      font-size: 9px;
      color: rgba(90,212,255,0.7);
      transition: transform 0.2s ease;
      line-height: 1;
    }

    .lang-trigger[aria-expanded="true"] .lang-arrow {
      transform: rotate(180deg);
    }

    .lang-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 150px;
      max-width: calc(100vw - 24px);
      max-height: 60vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
      margin: 0;
      list-style: none;
      background: linear-gradient(180deg, rgba(17,31,47,0.98), rgba(10,18,28,0.98));
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 300;
    }

    .lang-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease;
      font-weight: 600;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-option:hover,
    .lang-option:focus-visible {
      background: rgba(90,212,255,0.08);
      outline: none;
    }

    .lang-option.active {
      background: linear-gradient(135deg, rgba(58,160,255,0.2), rgba(90,212,255,0.1));
      color: var(--primary-2);
    }

    .lang-option.active::after {
      content: '✓';
      margin-left: auto;
      font-size: 11px;
      color: var(--success);
      font-weight: 800;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(27, 201, 142, 0.1);
      border: 1px solid rgba(27, 201, 142, 0.2);
      color: var(--success);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .workspace {
      position: relative;
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(360px, 1fr);
      gap: 14px;
      padding: 14px;
      padding-left: calc(14px + env(safe-area-inset-left, 0px));
      padding-right: calc(14px + env(safe-area-inset-right, 0px));
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      background: linear-gradient(180deg, rgba(17,31,47,0.9), rgba(10,18,28,0.95));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chart-panel {
      padding: 14px;
      min-height: 0;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 0 12px 0;
      flex-wrap: wrap;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      box-shadow: 0 0 18px rgba(58,160,255,0.8);
    }

    .chart-title h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .currency-pair-select {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .chart-pair-select {
      appearance: none;
      border: 1px solid rgba(90, 212, 255, 0.3);
      background: rgba(9, 24, 40, 0.6);
      color: var(--primary-2);
      font-size: 11px;
      border-radius: 6px;
      padding: 6px 24px 6px 10px;
      outline: none;
      min-width: 120px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
    }

    .chart-pair-select:hover {
      background: rgba(9, 24, 40, 0.8);
      border-color: rgba(90, 212, 255, 0.5);
    }

    .chart-pair-select:focus {
      background: rgba(9, 24, 40, 0.8);
      border-color: rgba(90, 212, 255, 0.7);
      box-shadow: 0 0 0 2px rgba(58, 160, 255, 0.1);
    }

    .chart-pair-select option {
      background: #0d1b2a;
      color: #edf6ff;
      padding: 6px;
    }

    .currency-pair-select::after {
      content: '▼';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: rgba(90,212,255,0.6);
      pointer-events: none;
    }

    .chart-toolbox {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .meta-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 32px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      background: rgba(255,255,255,0.02);
    }

    .meta-chip strong {
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
    }

    .period-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .period-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
    }

    .period-btn.active {
      background: linear-gradient(135deg, rgba(58,160,255,0.18), rgba(90,212,255,0.08));
      border-color: rgba(90,212,255,0.35);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(90,212,255,0.08);
    }

    .period-btn:hover {
      border-color: rgba(90,212,255,0.25);
      color: var(--text);
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: rgba(8, 17, 27, 0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 8px 8px;
      overflow: hidden;
    }

    #exchangeChart {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chart-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8,17,27,0.18);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 18px;
      pointer-events: none;
    }

    .panel.calc {
      padding: 14px;
      overflow: hidden;
    }

    .calc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .calc-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      font-size: 10px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      white-space: nowrap;
    }

    .calc-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .field-group label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .principal-presets {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .preset-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.5;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .preset-btn:hover {
      border-color: rgba(90,212,255,0.35);
      color: var(--text);
      background: rgba(90,212,255,0.06);
    }

    .preset-btn.active {
      background: linear-gradient(135deg, rgba(58,160,255,0.22), rgba(90,212,255,0.1));
      border-color: rgba(90,212,255,0.45);
      color: var(--primary-2);
      box-shadow: inset 0 0 0 1px rgba(90,212,255,0.08);
    }

    .number-input-wrapper {
      position: relative;
    }

    .field-group input[type="number"] {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(133, 157, 191, 0.25);
      background: rgba(9, 17, 27, 0.7);
      padding: 10px 28px 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .field-group input[type="number"]::-webkit-outer-spin-button,
    .field-group input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field-group input[type="number"] {
      -moz-appearance: textfield;
    }

    .field-group input[type="number"]:focus {
      border-color: rgba(58,160,255,0.8);
      box-shadow: 0 0 0 3px rgba(58,160,255,0.12);
      transform: translateY(-1px);
    }

    .number-input-wrapper::after,
    .number-input-wrapper::before {
      content: '';
      position: absolute;
      right: 10px;
      width: 6px;
      height: 6px;
      border-style: solid;
      pointer-events: auto;
      cursor: pointer;
      z-index: 2;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .number-input-wrapper::before {
      top: 7px;
      border-width: 0 3px 4px 3px;
      border-color: transparent transparent rgba(90, 212, 255, 0.8) transparent;
    }

    .number-input-wrapper::after {
      bottom: 7px;
      border-width: 4px 3px 0 3px;
      border-color: rgba(90, 212, 255, 0.8) transparent transparent transparent;
    }

    .number-input-wrapper:hover::before,
    .number-input-wrapper:hover::after {
      opacity: 1;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      flex-shrink: 0;
    }

    .result-card {
      background: linear-gradient(135deg, rgba(58,160,255,0.12), rgba(90,212,255,0.06));
      border: 1px solid rgba(90,212,255,0.18);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 2px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .result-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .result-line:last-of-type {
      border-bottom: none;
    }

    .result-line strong {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .result-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.09);
      min-height: 0;
    }

    .result-main-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .result-main strong {
      font-size: clamp(2rem, 3.4vw, 3rem);
      color: var(--warning);
      letter-spacing: 0.04em;
      line-height: 1.1;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(246, 196, 83, 0.18);
      transition: transform 0.2s ease, color 0.2s ease;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
      text-align: center;
    }

    .result-main strong.bump {
      transform: scale(1.04);
    }

    .result-main-hint {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      max-width: 100%;
      transition: color 0.2s ease;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .result-main-hint.positive { color: var(--success); }
    .result-main-hint.negative { color: var(--danger); }

    /* ============================================================
       移动端 / 平板：彻底回归文档流，整页可滚动
       ============================================================ */
    @media (max-width: 1100px) {
      /* 1. html 和 body 都允许纵向滚动 */
      html {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      body {
        display: block;
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        touch-action: pan-y;               /* 明确允许纵向滚动手势 */
        -webkit-overflow-scrolling: touch;
      }

      /* 2. page 从 flex 改为 block，避免高度计算问题 */
      .page {
        display: block;
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 100%;
        border-left: none;
        border-right: none;
      }

      /* 3. topbar 保持普通流，不再 sticky */
      .topbar {
        position: relative;
      }

      /* 4. workspace 从 grid 改为 block，各面板自然堆叠 */
      .workspace {
        display: block;
        padding: 12px;
        padding-left: calc(12px + env(safe-area-inset-left, 0px));
        padding-right: calc(12px + env(safe-area-inset-right, 0px));
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        overflow: visible;
        height: auto;
        min-height: 0;
      }

      /* 5. 面板不再裁剪内容 */
      .panel {
        overflow: visible;
        min-height: 0;
      }

      .chart-panel {
        height: auto;
        min-height: 0;
        margin-bottom: 12px;
        padding: 12px;
      }

      /* 6. 图表容器改为固定高度，避免 flex 计算问题 */
      .chart-wrap {
        flex: none;
        height: 300px;
        min-height: 0;
        max-height: none;
      }

      .panel.calc {
        padding: 12px;
        overflow: visible;
        min-height: auto;
      }

      .calc-body {
        flex: none;
        overflow: visible;
      }

      .result-card {
        flex: none;
        min-height: auto;
      }

      .result-main {
        flex: none;
        padding-top: 16px;
        padding-bottom: 8px;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 12px 14px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        padding-left: calc(14px + env(safe-area-inset-left, 0px));
        padding-right: calc(14px + env(safe-area-inset-right, 0px));
        gap: 10px;
      }
      .brand-title { font-size: 1rem; }
      .brand-label { font-size: 10px; }
      .lang-trigger { font-size: 10px; padding: 6px 9px; gap: 6px; }
      .lang-menu { min-width: 140px; }
      .status-pill { font-size: 10px; padding: 6px 8px; }

      .workspace {
        padding: 10px;
        padding-left: calc(10px + env(safe-area-inset-left, 0px));
        padding-right: calc(10px + env(safe-area-inset-right, 0px));
        padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      }

      .panel { border-radius: 14px; }
      .chart-panel, .panel.calc { padding: 12px; }

      .chart-panel { margin-bottom: 10px; }

      .chart-wrap {
        height: 280px;
      }

      .field-row { grid-template-columns: 1fr; }
      .chart-header { align-items: flex-start; }
      .chart-toolbox { flex-direction: column; align-items: flex-start; }
      .meta-strip { gap: 8px; }
      .meta-chip { font-size: 9px; padding: 4px 8px; }
      .meta-chip strong { font-size: 10px; }
      .result-main strong { font-size: 2.2rem; }
      .result-main-hint { font-size: 11px; }
      .calc-body { gap: 10px; }
      .preset-btn { font-size: 9px; padding: 2px 7px; }
    }

    @media (max-width: 380px) {
      .result-main strong { font-size: 1.9rem; }
      .period-btn { padding: 4px 8px; font-size: 9px; }
      .preset-btn { font-size: 9px; padding: 2px 6px; }
      .brand-label { display: none; }
      .status-pill { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" title="FX Flow">¥$</div>
        <div class="brand-copy">
          <div class="brand-label" data-i18n="brandLabel">Market desk</div>
          <div class="brand-title">FX Flow</div>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="lang-picker" id="langPicker">
          <button type="button" class="lang-trigger" id="langTrigger"
                  aria-haspopup="listbox" aria-expanded="false">
            <span class="lang-globe" aria-hidden="true"></span>
            <span class="lang-current" id="langCurrentLabel">简体中文</span>
            <span class="lang-arrow" aria-hidden="true">▾</span>
          </button>
          <ul class="lang-menu" id="langMenu" role="listbox">
            <li class="lang-option active" role="option" data-value="zh-CN" tabindex="0">简体中文</li>
            <li class="lang-option" role="option" data-value="en" tabindex="0">English</li>
            <li class="lang-option" role="option" data-value="ja" tabindex="0">日本語</li>
          </ul>
        </div>
        <span class="status-pill">● <span data-i18n="statusLive">LIVE</span></span>
      </div>
    </header>

    <main class="workspace">
      <section class="panel chart-panel">
        <div class="chart-header">
          <div class="chart-title">
            <span class="dot"></span>
            <h2 data-i18n="chartTitle">汇率走势</h2>
          </div>
          <div class="currency-pair-select">
            <select id="currencyPair" class="chart-pair-select" data-i18n-aria="pairLabel" aria-label="请选择货币对">
              <option value="USD_CNY" selected>USD/CNY</option>
              <option value="EUR_CNY">EUR/CNY</option>
              <option value="GBP_CNY">GBP/CNY</option>
              <option value="JPY_CNY">JPY/CNY</option>
              <option value="EUR_USD">EUR/USD</option>
              <option value="GBP_USD">GBP/USD</option>
            </select>
          </div>
        </div>

        <div class="chart-toolbox">
          <div class="meta-strip">
            <div class="meta-chip"><span data-i18n="metaLatest">最新</span> <strong id="metaLatest">--</strong></div>
            <div class="meta-chip"><span data-i18n="metaOpen">开盘</span> <strong id="metaOpen">--</strong></div>
            <div class="meta-chip"><span data-i18n="metaHigh">最高</span> <strong id="metaHigh">--</strong></div>
            <div class="meta-chip"><span data-i18n="metaLow">最低</span> <strong id="metaLow">--</strong></div>
          </div>

          <div class="period-picker" aria-label="Period">
            <button class="period-btn" data-period="7">7D</button>
            <button class="period-btn" data-period="30">1M</button>
            <button class="period-btn active" data-period="90">3M</button>
            <button class="period-btn" data-period="365">1Y</button>
            <button class="period-btn" data-period="1825">5Y</button>
            <button class="period-btn" data-period="18250">MAX</button>
          </div>
        </div>

        <div class="chart-wrap">
          <canvas id="exchangeChart"></canvas>
          <div class="chart-overlay" id="chartOverlay" data-i18n="loadingRates">加载中…</div>
        </div>
      </section>

      <aside class="panel calc">
        <div class="calc-header">
          <div class="calc-title" data-i18n="calcTitle">换汇计算器</div>
          <span class="mini-pill" data-i18n="riskCheck">风险检测</span>
        </div>

        <div class="calc-body">
          <div class="field-group">
            <div class="field-label-row">
              <label for="principal" data-i18n="principal">本金</label>
              <div class="principal-presets" id="principalPresets">
                <button type="button" class="preset-btn" data-value="100" title="100">100</button>
                <button type="button" class="preset-btn" data-value="1000" title="1,000">1k</button>
                <button type="button" class="preset-btn" data-value="10000" title="10,000">10k</button>
                <button type="button" class="preset-btn" data-value="50000" title="50,000">50k</button>
                <button type="button" class="preset-btn" data-value="100000" title="100,000">100k</button>
                <button type="button" class="preset-btn" data-value="1000000" title="1,000,000">1M</button>
              </div>
            </div>
            <div class="number-input-wrapper">
              <input id="principal" type="number" value="10000" min="0" step="100"
                     data-i18n-placeholder="placeholderAmount" placeholder="请输入金额">
            </div>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="rateA" data-i18n="rateA">汇率 A</label>
              <div class="number-input-wrapper">
                <input id="rateA" type="number" value="6.66" min="0.0001" step="0.0001"
                       data-i18n-placeholder="placeholderRateA" placeholder="例如 6.66">
              </div>
            </div>
            <div class="field-group">
              <label for="rateB" data-i18n="rateB">汇率 B</label>
              <div class="number-input-wrapper">
                <input id="rateB" type="number" value="6.67" min="0.0001" step="0.0001"
                       data-i18n-placeholder="placeholderRateB" placeholder="例如 6.67">
              </div>
            </div>
          </div>

          <div class="result-card">
            <div class="result-line">
              <span data-i18n="resultA">按汇率 A 换得</span>
              <strong id="resultA">--</strong>
            </div>
            <div class="result-line">
              <span data-i18n="resultB">按汇率 B 换得</span>
              <strong id="resultB">--</strong>
            </div>
            <div class="result-main">
              <span class="result-main-label" data-i18n="difference">差额</span>
              <strong id="difference">--</strong>
              <span class="result-main-hint" id="differenceHint">--</span>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      const i18n = {
        'zh-CN': {
          pageTitle: 'FX Flow — 汇率与换汇差额',
          brandLabel: 'Market desk',
          statusLive: 'LIVE',
          chartTitle: '汇率走势',
          pairLabel: '请选择货币对',
          metaLatest: '最新',
          metaOpen: '开盘',
          metaHigh: '最高',
          metaLow: '最低',
          calcTitle: '换汇计算器',
          riskCheck: '风险检测',
          principal: '本金',
          rateA: '汇率 A',
          rateB: '汇率 B',
          resultA: '按汇率 A 换得',
          resultB: '按汇率 B 换得',
          difference: '差额',
          placeholderAmount: '请输入金额',
          placeholderRateA: '例如 6.66',
          placeholderRateB: '例如 6.67',
          loadingRates: '加载汇率数据…',
          loadFailed: '数据加载失败',
          noRates: '暂无汇率数据',
          noValidRates: '无有效汇率',
          networkError: '网络或数据错误',
          sameHint: '两种汇率换得金额相同',
          hintA: (n) => `汇率 A 更划算，比 B 多换 ${n}`,
          hintB: (n) => `汇率 B 更划算，比 A 多换 ${n}`
        },
        en: {
          pageTitle: 'FX Flow — Exchange Rate & Conversion Difference',
          brandLabel: 'Market desk',
          statusLive: 'LIVE',
          chartTitle: 'Exchange Rate Trend',
          pairLabel: 'Select currency pair',
          metaLatest: 'Latest',
          metaOpen: 'Open',
          metaHigh: 'High',
          metaLow: 'Low',
          calcTitle: 'Currency Converter',
          riskCheck: 'Risk Check',
          principal: 'Principal',
          rateA: 'Rate A',
          rateB: 'Rate B',
          resultA: 'Converted at Rate A',
          resultB: 'Converted at Rate B',
          difference: 'Difference',
          placeholderAmount: 'Enter amount',
          placeholderRateA: 'e.g. 6.66',
          placeholderRateB: 'e.g. 6.67',
          loadingRates: 'Loading exchange rate data…',
          loadFailed: 'Failed to load data',
          noRates: 'No exchange rate data',
          noValidRates: 'No valid exchange rate',
          networkError: 'Network or data error',
          sameHint: 'Both rates convert to the same amount',
          hintA: (n) => `Rate A is better — converts ${n} more than B`,
          hintB: (n) => `Rate B is better — converts ${n} more than A`
        },
        ja: {
          pageTitle: 'FX Flow — 為替レートと換算差額',
          brandLabel: 'マーケットデスク',
          statusLive: 'LIVE',
          chartTitle: '為替レート推移',
          pairLabel: '通貨ペアを選択',
          metaLatest: '最新',
          metaOpen: '始値',
          metaHigh: '高値',
          metaLow: '安値',
          calcTitle: '為替計算機',
          riskCheck: 'リスク検出',
          principal: '元本',
          rateA: 'レート A',
          rateB: 'レート B',
          resultA: 'レート A での換算額',
          resultB: 'レート B での換算額',
          difference: '差額',
          placeholderAmount: '金額を入力',
          placeholderRateA: '例 6.66',
          placeholderRateB: '例 6.67',
          loadingRates: '為替データを読み込み中…',
          loadFailed: 'データの読み込みに失敗',
          noRates: '為替データがありません',
          noValidRates: '有効なレートがありません',
          networkError: 'ネットワークまたはデータエラー',
          sameHint: '両レートの換算額は同じです',
          hintA: (n) => `レート A が有利 — B より ${n} 多く換算`,
          hintB: (n) => `レート B が有利 — A より ${n} 多く換算`
        }
      };

      const LANG_LABELS = { 'zh-CN': '简体中文', 'en': 'English', 'ja': '日本語' };
      let currentLang = 'zh-CN';

      function t(key) {
        const dict = i18n[currentLang] || i18n['zh-CN'];
        const v = dict[key];
        return typeof v === 'string' ? v : (i18n['zh-CN'][key] || key);
      }
      function tf(key, ...args) {
        const dict = i18n[currentLang] || i18n['zh-CN'];
        const v = dict[key] !== undefined ? dict[key] : i18n['zh-CN'][key];
        return typeof v === 'function' ? v(...args) : v;
      }

      const langPickerEl = document.getElementById('langPicker');
      const langTriggerEl = document.getElementById('langTrigger');
      const langMenuEl = document.getElementById('langMenu');
      const langCurrentLabelEl = document.getElementById('langCurrentLabel');
      const langOptions = Array.from(langMenuEl.querySelectorAll('.lang-option'));

      const currencyPairEl = document.getElementById('currencyPair');
      const principalEl = document.getElementById('principal');
      const rateAEl = document.getElementById('rateA');
      const rateBEl = document.getElementById('rateB');
      const resultAEl = document.getElementById('resultA');
      const resultBEl = document.getElementById('resultB');
      const diffEl = document.getElementById('difference');
      const diffHintEl = document.getElementById('differenceHint');
      const metaLatestEl = document.getElementById('metaLatest');
      const metaOpenEl = document.getElementById('metaOpen');
      const metaHighEl = document.getElementById('metaHigh');
      const metaLowEl = document.getElementById('metaLow');
      const chartOverlayEl = document.getElementById('chartOverlay');

      const principalPresetsEl = document.getElementById('principalPresets');
      const presetButtons = principalPresetsEl
        ? Array.from(principalPresetsEl.querySelectorAll('.preset-btn'))
        : [];

      const currencyMap = {
        USD_CNY: { base: 'USD', target: 'CNY', label: 'USD/CNY' },
        EUR_CNY: { base: 'EUR', target: 'CNY', label: 'EUR/CNY' },
        GBP_CNY: { base: 'GBP', target: 'CNY', label: 'GBP/CNY' },
        JPY_CNY: { base: 'JPY', target: 'CNY', label: 'JPY/CNY' },
        EUR_USD: { base: 'EUR', target: 'USD', label: 'EUR/USD' },
        GBP_USD: { base: 'GBP', target: 'USD', label: 'GBP/USD' }
      };

      const periodButtons = Array.from(document.querySelectorAll('.period-btn'));
      let chartInstance = null;

      /* ===== 语言选择器 ===== */
      function openLangMenu() {
        langMenuEl.classList.add('open');
        langTriggerEl.setAttribute('aria-expanded', 'true');
      }
      function closeLangMenu() {
        langMenuEl.classList.remove('open');
        langTriggerEl.setAttribute('aria-expanded', 'false');
      }
      function toggleLangMenu() {
        if (langMenuEl.classList.contains('open')) closeLangMenu();
        else openLangMenu();
      }
      function updateLangUI() {
        langCurrentLabelEl.textContent = LANG_LABELS[currentLang] || currentLang;
        langOptions.forEach((o) => o.classList.toggle('active', o.dataset.value === currentLang));
      }
      function selectLang(value) {
        if (!i18n[value]) return;
        currentLang = value;
        try { localStorage.setItem('fxflow.lang', currentLang); } catch (err) {}
        updateLangUI();
        applyLang();
        closeLangMenu();
      }

      langTriggerEl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLangMenu();
      });
      langOptions.forEach((opt) => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          selectLang(opt.dataset.value);
        });
        opt.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectLang(opt.dataset.value);
          }
        });
      });
      document.addEventListener('pointerdown', (e) => {
        if (!langPickerEl.contains(e.target)) closeLangMenu();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLangMenu();
      });

      function applyLang() {
        document.documentElement.lang = currentLang;
        document.title = t('pageTitle');
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
          el.placeholder = t(el.dataset.i18nPlaceholder);
        });
        document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
          el.setAttribute('aria-label', t(el.dataset.i18nAria));
        });
        if (chartOverlayEl && chartOverlayEl.style.display === 'flex') {
          if (chartOverlayEl.dataset.state === 'loading') {
            chartOverlayEl.textContent = t('loadingRates');
          } else if (chartOverlayEl.dataset.state === 'failed') {
            chartOverlayEl.textContent = t('loadFailed');
          }
        }
        calculate();
      }
      function detectInitialLang() {
        try {
          const saved = localStorage.getItem('fxflow.lang');
          if (saved && i18n[saved]) return saved;
        } catch (err) {}
        const nav = (navigator.language || 'zh-CN').toLowerCase();
        if (nav.startsWith('zh')) return 'zh-CN';
        if (nav.startsWith('ja')) return 'ja';
        if (nav.startsWith('en')) return 'en';
        return 'zh-CN';
      }

      /* ===== 工具 ===== */
      function roundRate(value, decimals) {
        const factor = Math.pow(10, decimals);
        const rounded = Math.round((value + Number.EPSILON) * factor) / factor;
        return Number(rounded.toFixed(decimals));
      }
      function formatRateForInput(value) {
        const abs = Math.abs(value);
        let decimals;
        if (abs >= 100) decimals = 2;
        else if (abs >= 1) decimals = 4;
        else if (abs >= 0.01) decimals = 6;
        else decimals = 8;
        return String(roundRate(value, decimals));
      }
      function formatNumber(value) {
        return Number(value || 0).toFixed(2);
      }
      function syncPresetActive() {
        if (!presetButtons.length) return;
        const current = parseFloat(principalEl.value);
        presetButtons.forEach((btn) => {
          btn.classList.toggle('active', Number(btn.dataset.value) === current);
        });
      }

      /* ===== 计算 ===== */
      function calculate() {
        const principal = parseFloat(principalEl.value) || 0;
        const rateA = parseFloat(rateAEl.value) || 0;
        const rateB = parseFloat(rateBEl.value) || 0;
        const resultA = rateA > 0 ? principal / rateA : 0;
        const resultB = rateB > 0 ? principal / rateB : 0;
        const diff = resultA - resultB;
        const absDiff = Math.abs(diff);

        resultAEl.textContent = formatNumber(resultA);
        resultBEl.textContent = formatNumber(resultB);

        if (absDiff < 0.005) {
          diffEl.textContent = '0.00';
          diffEl.style.color = 'var(--muted)';
          diffHintEl.textContent = t('sameHint');
          diffHintEl.className = 'result-main-hint';
        } else if (diff > 0) {
          diffEl.textContent = '+' + formatNumber(absDiff);
          diffEl.style.color = 'var(--success)';
          diffHintEl.textContent = tf('hintA', formatNumber(absDiff));
          diffHintEl.className = 'result-main-hint positive';
        } else {
          diffEl.textContent = '−' + formatNumber(absDiff);
          diffEl.style.color = 'var(--danger)';
          diffHintEl.textContent = tf('hintB', formatNumber(absDiff));
          diffHintEl.className = 'result-main-hint negative';
        }

        diffEl.classList.remove('bump');
        void diffEl.offsetWidth;
        diffEl.classList.add('bump');
        window.setTimeout(() => diffEl.classList.remove('bump'), 220);
        syncPresetActive();
      }

      function setPeriodActive(value) {
        periodButtons.forEach((button) => {
          button.classList.toggle('active', String(button.dataset.period) === String(value));
        });
      }
      function formatDate(date) {
        return date.toISOString().slice(0, 10);
      }
      function formatDateLabel(date, days) {
        if (days <= 90) return date.slice(5);
        else if (days <= 365) return date.slice(0, 7);
        else return date.slice(0, 4);
      }

      /* ===== 拉取数据 ===== */
      async function fetchRates(options = {}) {
        const { syncRates = false } = options;
        const pairKey = currencyPairEl.value;
        const pair = currencyMap[pairKey];
        const days = Number(document.querySelector('.period-btn.active')?.dataset.period || 90);
        const end = new Date();
        end.setHours(0, 0, 0, 0);
        const start = new Date(end);
        start.setDate(start.getDate() - days);

        const url = `https://api.frankfurter.dev/v1/${formatDate(start)}..${formatDate(end)}?base=${pair.base}&symbols=${pair.target}`;

        chartOverlayEl.style.display = 'flex';
        chartOverlayEl.dataset.state = 'loading';
        chartOverlayEl.textContent = t('loadingRates');

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(t('networkError'));
          const data = await response.json();

          if (!data.rates || Object.keys(data.rates).length === 0) {
            throw new Error(t('noRates'));
          }

          const labels = [];
          const values = [];
          Object.keys(data.rates).sort().forEach((date) => {
            const value = data.rates[date]?.[pair.target];
            if (value) {
              labels.push(formatDateLabel(date, days));
              values.push(value);
            }
          });

          if (!values.length) throw new Error(t('noValidRates'));

          renderChart(labels, values, pairKey);

          const latestValue = values[values.length - 1];
          const firstValue = values[0];
          const maxValue = Math.max(...values);
          const minValue = Math.min(...values);

          metaLatestEl.textContent = latestValue.toFixed(4);
          metaOpenEl.textContent = firstValue.toFixed(4);
          metaHighEl.textContent = maxValue.toFixed(4);
          metaLowEl.textContent = minValue.toFixed(4);
          chartOverlayEl.style.display = 'none';
          chartOverlayEl.dataset.state = '';

          if (syncRates) {
            const formatted = formatRateForInput(latestValue);
            rateAEl.value = formatted;
            rateBEl.value = formatted;
            calculate();
          }
        } catch (err) {
          console.error(err);
          chartOverlayEl.textContent = t('loadFailed');
          chartOverlayEl.dataset.state = 'failed';
          chartOverlayEl.style.display = 'flex';
        }
      }

      function renderChart(labels, values, pairKey) {
        const pair = currencyMap[pairKey];
        const ctx = document.getElementById('exchangeChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        const displayLabels = labels.map((label, idx) => {
          const step = Math.max(1, Math.ceil(labels.length / 8));
          return idx % step === 0 ? label : '';
        });

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: displayLabels,
            datasets: [{
              label: `${pair.base}/${pair.target}`,
              data: values,
              borderColor: '#5ad4ff',
              pointBackgroundColor: '#5ad4ff',
              pointBorderColor: '#071521',
              pointBorderWidth: 1,
              pointRadius: 0,
              pointHoverRadius: 4,
              backgroundColor: 'rgba(90, 212, 255, 0.12)',
              borderWidth: 2.5,
              fill: true,
              tension: 0.38
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            animation: { duration: 450, easing: 'easeOutQuart' },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(7, 21, 33, 0.94)',
                titleColor: '#edf6ff',
                bodyColor: '#ecf5ff',
                padding: 10,
                borderColor: 'rgba(90,212,255,0.25)',
                borderWidth: 1,
                displayColors: false,
                callbacks: {
                  title: (items) => items[0].label || '',
                  label: (context) => `${pair.base}/${pair.target}: ${context.parsed.y.toFixed(4)}`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false, drawBorder: false },
                ticks: { color: '#8aa0b7', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 },
                border: { display: false }
              },
              y: {
                grid: { color: 'rgba(138,160,183,0.1)', drawBorder: false },
                ticks: { color: '#8aa0b7', font: { size: 10 }, callback: (v) => Number(v).toFixed(2) },
                border: { display: false }
              }
            }
          }
        });
      }

      /* ===== 数字输入框箭头 ===== */
      const ARROW_ZONE = 30;
      const HOLD_DELAY = 350;
      const HOLD_SPEED = 60;

      function getStep(input) {
        const step = parseFloat(input.step);
        return Number.isFinite(step) && step > 0 ? step : 1;
      }
      function adjustValue(input, direction) {
        const step = getStep(input);
        const current = parseFloat(input.value);
        let next = (Number.isFinite(current) ? current : 0) + direction * step;

        const min = parseFloat(input.min);
        const max = parseFloat(input.max);
        if (Number.isFinite(min)) next = Math.max(min, next);
        if (Number.isFinite(max)) next = Math.min(max, next);

        const decimals = (String(step).split('.')[1] || '').length;
        next = decimals > 0 ? Number(next.toFixed(decimals)) : Math.round(next);

        const nextStr = String(next);
        if (nextStr === input.value) return;
        input.value = nextStr;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }

      document.querySelectorAll('.number-input-wrapper').forEach((wrapper) => {
        const input = wrapper.querySelector('input[type="number"]');
        if (!input) return;

        let holdTimer = null;
        let repeatTimer = null;
        const stopHold = () => {
          window.clearTimeout(holdTimer);
          window.clearInterval(repeatTimer);
          holdTimer = null;
          repeatTimer = null;
        };
        const startHold = (direction) => {
          stopHold();
          holdTimer = window.setTimeout(() => {
            repeatTimer = window.setInterval(() => adjustValue(input, direction), HOLD_SPEED);
          }, HOLD_DELAY);
        };

        wrapper.addEventListener('pointerdown', (event) => {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          const rect = wrapper.getBoundingClientRect();
          const offsetX = event.clientX - rect.left;
          if (offsetX < rect.width - ARROW_ZONE) return;

          event.preventDefault();
          input.focus();
          const direction = (event.clientY - rect.top) < rect.height / 2 ? 1 : -1;
          adjustValue(input, direction);
          startHold(direction);
        });

        window.addEventListener('pointerup', stopHold);
        window.addEventListener('pointercancel', stopHold);
        window.addEventListener('blur', stopHold);
        wrapper.addEventListener('pointerleave', stopHold);
      });

      /* ===== 本金快捷按钮 ===== */
      presetButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          principalEl.value = btn.dataset.value;
          principalEl.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });

      /* ===== 事件绑定 ===== */
      currencyPairEl.addEventListener('change', () => fetchRates({ syncRates: true }));
      principalEl.addEventListener('input', calculate);
      rateAEl.addEventListener('input', calculate);
      rateBEl.addEventListener('input', calculate);

      periodButtons.forEach((button) => {
        button.addEventListener('click', function () {
          setPeriodActive(this.dataset.period);
          fetchRates({ syncRates: false });
        });
      });

      /* ===== 初始化 ===== */
      currentLang = detectInitialLang();
      updateLangUI();
      applyLang();
      setPeriodActive(90);
      fetchRates({ syncRates: true });
    })();
  </script>
</body>
</html>
