<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人民币美元换汇差额计算器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232c6bed'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='system-ui'>¥$</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --line: #e8edf5;
      --text: #1d2433;
      --muted: #5d6879;
      --primary: #2c6bed;
      --primary-2: #5b8cff;
      --good: #1f9d61;
      --bad: #df5d5d;
      --gold: #f4ba43;
      --shadow: 0 18px 45px rgba(18, 33, 61, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .container {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid rgba(127, 142, 170, 0.14);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 24px 14px;
      background: linear-gradient(135deg, rgba(44,107,237,0.06), rgba(91,140,255,0.02));
      border-bottom: 1px solid var(--line);
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-wrap .icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 12px 24px rgba(44,107,237,0.24);
      font-weight: bold;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2rem);
      letter-spacing: 0.02em;
    }

    .badge {
      background: rgba(31,157,97,0.12);
      color: var(--good);
      border: 1px solid rgba(31,157,97,0.18);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      white-space: nowrap;
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      padding: 20px 24px 24px;
      background: linear-gradient(180deg, rgba(247,249,252,0.65), #fff);
    }

    .panel {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
    }

    .chart-panel {
      margin-bottom: 18px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .chart-header h2 {
      margin: 0;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 600;
    }

    .chart-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .control-group label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    select {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:hover {
      border-color: rgba(44,107,237,0.5);
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(44,107,237,0.1);
    }

    .rate-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(31,157,97,0.1);
      color: var(--good);
      border: 1px solid rgba(31,157,97,0.1);
      font-size: 12px;
      font-weight: 700;
    }

    .chart-box {
      position: relative;
      min-height: 280px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(228,236,255,0.4));
      border: 1px solid rgba(95, 120, 170, 0.15);
      padding: 12px;
    }

    #exchangeChart {
      max-height: 250px;
    }

    .chart-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 26px;
      background: rgba(255,255,255,0.3);
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field-group {
      display: grid;
      gap: 8px;
    }

    .field-group label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .field-group input {
      width: 100%;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 12px;
      font-size: 15px;
      color: var(--text);
      padding: 13px 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-group input:focus {
      border-color: rgba(44,107,237,0.8);
      box-shadow: 0 0 0 4px rgba(44,107,237,0.12);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .result-panel {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .summary-card {
      background: linear-gradient(135deg, #2c6bed 0%, #5b8cff 100%);
      border-radius: 18px;
      padding: 18px 20px;
      color: white;
      box-shadow: 0 18px 30px rgba(44,107,237,0.25);
    }

    .summary-card h3 {
      margin: 0 0 14px;
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      font-size: 14px;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item strong {
      font-size: 1.05rem;
    }

    .result-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.14);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .result-total strong {
      font-size: clamp(1.5rem, 2vw, 2.1rem);
      color: #fbe29d;
    }

    .status-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(44,107,237,0.08);
      border-radius: 999px;
      font-size: 12px;
      color: var(--primary);
      font-weight: 700;
      border: 1px solid rgba(44,107,237,0.08);
    }

    .status-pill.good {
      background: rgba(31,157,97,0.08);
      color: var(--good);
      border-color: rgba(31,157,97,0.12);
    }

    .status-pill.bad {
      background: rgba(223,93,93,0.08);
      color: var(--bad);
      border-color: rgba(223,93,93,0.12);
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      padding: 2px 2px 0;
    }

    .value-positive {
      color: #d9f9eb;
    }

    .value-negative {
      color: #ffe1e1;
    }

    @media (max-width: 760px) {
      .content {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 16px 18px 12px;
      }

      .content {
        padding: 16px 18px 18px;
      }

      .chart-controls {
        flex-direction: column;
        align-items: flex-start;
      }

      .control-group {
        width: 100%;
      }

      select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-wrap">
        <div class="icon">¥$</div>
        <h1>人民币美元换汇差额计算器</h1>
      </div>
      <span class="badge">实时汇率</span>
    </div>

    <div class="content">
      <div>
        <div class="panel chart-panel">
          <div class="chart-header">
            <h2>📈 汇率走势</h2>
            <span class="rate-badge" id="latestRate">加载中…</span>
          </div>

          <div class="chart-controls">
            <div class="control-group">
              <label for="currencyPair">货币对：</label>
              <select id="currencyPair">
                <option value="USD_CNY">美元 → 人民币 (USD/CNY)</option>
                <option value="EUR_CNY">欧元 → 人民币 (EUR/CNY)</option>
                <option value="GBP_CNY">英镑 → 人民币 (GBP/CNY)</option>
                <option value="JPY_CNY">日元 → 人民币 (JPY/CNY)</option>
                <option value="EUR_USD">欧元 → 美元 (EUR/USD)</option>
                <option value="GBP_USD">英镑 → 美元 (GBP/USD)</option>
              </select>
            </div>
            <div class="control-group">
              <label for="timePeriod">时间周期：</label>
              <select id="timePeriod">
                <option value="7">7 天</option>
                <option value="30" selected>30 天</option>
                <option value="90">90 天</option>
                <option value="365">1 年</option>
              </select>
            </div>
          </div>

          <div class="chart-box">
            <canvas id="exchangeChart"></canvas>
            <div class="chart-loading" id="chartLoading">正在获取汇率数据…</div>
          </div>
        </div>

        <form>
          <div class="field-group">
            <label for="principal">本金金额</label>
            <input type="number" id="principal" value="10000" min="0" step="100" placeholder="请输入金额">
          </div>

          <div class="row">
            <div class="field-group">
              <label for="rateA">汇率 A</label>
              <input type="number" id="rateA" value="6.66" min="0.01" step="0.01" placeholder="例如：6.66">
            </div>
            <div class="field-group">
              <label for="rateB">汇率 B</label>
              <input type="number" id="rateB" value="6.67" min="0.01" step="0.01" placeholder="例如：6.67">
            </div>
          </div>
        </form>
      </div>

      <div class="result-panel">
        <div class="summary-card">
          <h3>换汇结果</h3>

          <div class="result-item">
            <span>按汇率 A 换得</span>
            <strong id="resultA">$0.00</strong>
          </div>

          <div class="result-item">
            <span>按汇率 B 换得</span>
            <strong id="resultB">$0.00</strong>
          </div>

          <div class="result-total">
            <span>换汇差额</span>
            <strong id="difference">$0.00</strong>
          </div>
        </div>

        <div class="status-row">
          <span class="status-pill" id="betterOption">更划算方案：待计算</span>
        </div>

        <p class="note">
          说明：汇率数值越大，说明目标货币越贵；同样的源货币兑换时，能拿到的目标货币就越少。<br>
          计算公式：目标货币 = 源货币 ÷ 汇率；差额 = |按 A 换得 − 按 B 换得|。
        </p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const principalEl = document.getElementById('principal');
      const rateAEl = document.getElementById('rateA');
      const rateBEl = document.getElementById('rateB');
      const resultAEl = document.getElementById('resultA');
      const resultBEl = document.getElementById('resultB');
      const diffEl = document.getElementById('difference');
      const betterOptionEl = document.getElementById('betterOption');
      const currencyPairEl = document.getElementById('currencyPair');
      const timePeriodEl = document.getElementById('timePeriod');
      const chartLoadingEl = document.getElementById('chartLoading');
      const latestRateEl = document.getElementById('latestRate');

      let chartInstance = null;

      const currencyMap = {
        USD_CNY: { base: 'USD', target: 'CNY', name: 'USD/CNY' },
        EUR_CNY: { base: 'EUR', target: 'CNY', name: 'EUR/CNY' },
        GBP_CNY: { base: 'GBP', target: 'CNY', name: 'GBP/CNY' },
        JPY_CNY: { base: 'JPY', target: 'CNY', name: 'JPY/CNY' },
        EUR_USD: { base: 'EUR', target: 'USD', name: 'EUR/USD' },
        GBP_USD: { base: 'GBP', target: 'USD', name: 'GBP/USD' },
      };

      function formatCurrency(value, currencyPair) {
        const { target } = currencyMap[currencyPair];
        const symbol = target === 'CNY' ? '¥' : target === 'USD' ? '$' : target;
        return symbol + Number(value || 0).toFixed(2);
      }

      function calculate() {
        const principal = parseFloat(principalEl.value) || 0;
        const rateA = parseFloat(rateAEl.value) || 0;
        const rateB = parseFloat(rateBEl.value) || 0;

        const usdA = rateA > 0 ? principal / rateA : 0;
        const usdB = rateB > 0 ? principal / rateB : 0;
        const diff = usdA - usdB;

        const currencyPair = currencyPairEl.value;
        resultAEl.textContent = formatCurrency(usdA, currencyPair);
        resultBEl.textContent = formatCurrency(usdB, currencyPair);

        if (Math.abs(diff) < 0.001) {
          diffEl.textContent = formatCurrency(0, currencyPair);
          diffEl.className = 'value';
          betterOptionEl.textContent = '更划算方案：两者相同';
          betterOptionEl.className = 'status-pill';
        } else {
          const absDiff = Math.abs(diff);
          const directionText = diff > 0 ? 'A 更划算' : 'B 更划算';
          diffEl.textContent = formatCurrency(absDiff, currencyPair) + (diff > 0 ? '（A比B多）' : '（B比A多）');
          diffEl.className = diff > 0 ? 'value-positive' : 'value-negative';
          betterOptionEl.textContent = '更划算方案：' + directionText;
          betterOptionEl.className = 'status-pill ' + (diff > 0 ? 'good' : 'bad');
        }
      }

      function formatDate(date) {
        return date.toISOString().slice(0, 10);
      }

      async function fetchExchangeRates() {
        const currencyPair = currencyPairEl.value;
        const days = parseInt(timePeriodEl.value);
        const { base, target } = currencyMap[currencyPair];

        const end = new Date();
        end.setHours(0, 0, 0, 0);
        const start = new Date(end);
        start.setDate(start.getDate() - days);

        chartLoadingEl.style.display = 'grid';

        const url = `https://api.frankfurter.dev/v1/${formatDate(start)}..${formatDate(end)}?base=${base}&symbols=${target}`;

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('API error');
          const data = await response.json();

          if (!data.rates || Object.keys(data.rates).length === 0) {
            throw new Error('No data available');
          }

          const entries = Object.keys(data.rates).sort();
          const labels = [];
          const values = [];

          for (const date of entries) {
            const rate = data.rates[date]?.[target];
            if (rate) {
              labels.push(date.slice(5).replace('-', '/'));
              values.push(rate);
            }
          }

          if (values.length === 0) throw new Error('No valid rates');

          renderChart(labels, values, currencyPair);
          const latestRate = values[values.length - 1];
          latestRateEl.textContent = `最新: 1 ${base} = ${latestRate.toFixed(4)} ${target}`;
          chartLoadingEl.style.display = 'none';
        } catch (err) {
          console.error('Fetch error:', err);
          chartLoadingEl.textContent = '📉 数据加载失败，请检查网络连接';
        }
      }

      function renderChart(labels, values, currencyPair) {
        const { base, target } = currencyMap[currencyPair];
        const ctx = document.getElementById('exchangeChart').getContext('2d');

        if (chartInstance) {
          chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: `${base}/${target} Exchange Rate`,
              data: values,
              borderColor: '#2c6bed',
              backgroundColor: 'rgba(44, 107, 237, 0.08)',
              borderWidth: 2.5,
              fill: true,
              tension: 0.4,
              pointRadius: 3,
              pointBackgroundColor: '#2c6bed',
              pointBorderColor: '#fff',
              pointBorderWidth: 2,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: '#5b8cff',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: {
                display: true,
                labels: {
                  color: '#5d6879',
                  font: { size: 12, weight: '600' },
                  usePointStyle: true,
                  padding: 15,
                }
              },
              tooltip: {
                backgroundColor: 'rgba(29, 36, 51, 0.9)',
                titleColor: '#fff',
                bodyColor: '#fff',
                borderColor: 'rgba(44, 107, 237, 0.3)',
                borderWidth: 1,
                padding: 12,
                displayColors: false,
                callbacks: {
                  label: function(context) {
                    return `${base}/${target}: ${context.parsed.y.toFixed(4)}`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: false,
                grid: {
                  color: 'rgba(95, 120, 170, 0.1)',
                  drawBorder: false,
                },
                ticks: {
                  color: '#7f8aa0',
                  font: { size: 11 },
                  callback: function(value) {
                    return value.toFixed(2);
                  }
                }
              },
              x: {
                grid: {
                  display: false,
                },
                ticks: {
                  color: '#7f8aa0',
                  font: { size: 11 },
                  maxTicksLimit: 6,
                }
              }
            }
          }
        });
      }

      // Event listeners
      principalEl.addEventListener('input', calculate);
      rateAEl.addEventListener('input', calculate);
      rateBEl.addEventListener('input', calculate);
      currencyPairEl.addEventListener('change', () => {
        calculate();
        fetchExchangeRates();
      });
      timePeriodEl.addEventListener('change', fetchExchangeRates);

      // Initial render
      calculate();
      setTimeout(fetchExchangeRates, 100);
    })();
  </script>
</body>
</html>
