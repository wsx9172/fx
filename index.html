<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人民币美元换汇差额计算器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%232c6bed'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='system-ui'>¥$</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --line: #e8edf5;
      --text: #1d2433;
      --muted: #5d6879;
      --primary: #2c6bed;
      --primary-2: #5b8cff;
      --good: #1f9d61;
      --bad: #df5d5d;
      --gold: #f4ba43;
      --shadow: 0 18px 45px rgba(18, 33, 61, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .container {
      width: 100%;
      height: 100%;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 20px 12px;
      background: linear-gradient(135deg, rgba(44,107,237,0.06), rgba(91,140,255,0.02));
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-wrap .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      box-shadow: 0 8px 16px rgba(44,107,237,0.24);
      font-weight: bold;
      letter-spacing: -1px;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .title-wrap .icon:hover {
      transform: scale(1.08) rotate(5deg);
      box-shadow: 0 12px 24px rgba(44,107,237,0.32);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 1.8vw, 1.4rem);
      letter-spacing: 0.02em;
    }

    .badge {
      background: rgba(31,157,97,0.12);
      color: var(--good);
      border: 1px solid rgba(31,157,97,0.18);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 0.75fr;
      gap: 14px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(247,249,252,0.65), #fff);
      flex: 1;
      overflow: hidden;
    }

    .panel {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chart-panel {
      margin-bottom: 0;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .chart-header h2 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
    }

    .chart-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    .control-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .control-group label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    select {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 120px;
    }

    select:hover {
      border-color: rgba(44,107,237,0.5);
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(44,107,237,0.1);
    }

    .rate-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(31,157,97,0.1);
      color: var(--good);
      border: 1px solid rgba(31,157,97,0.1);
      font-size: 11px;
      font-weight: 700;
    }

    .chart-box {
      position: relative;
      flex: 1;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(228,236,255,0.3));
      border: 1px solid rgba(95, 120, 170, 0.15);
      padding: 10px;
      min-height: 200px;
    }

    .chart-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #exchangeChart {
      width: 100%;
      height: 100%;
    }

    .chart-tooltip {
      position: absolute;
      background: rgba(29, 36, 51, 0.95);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      pointer-events: none;
      z-index: 100;
      border: 1px solid rgba(44, 107, 237, 0.3);
      display: none;
      white-space: nowrap;
    }

    .chart-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(4px);
    }

    form {
      display: grid;
      gap: 10px;
    }

    .field-group {
      display: grid;
      gap: 5px;
    }

    .field-group label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .field-group input {
      width: 100%;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text);
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-group input:focus {
      border-color: rgba(44,107,237,0.8);
      box-shadow: 0 0 0 3px rgba(44,107,237,0.1);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result-panel {
      display: grid;
      gap: 10px;
      align-content: start;
      overflow-y: auto;
      max-height: 100%;
    }

    .result-panel::-webkit-scrollbar {
      width: 5px;
    }

    .result-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .result-panel::-webkit-scrollbar-thumb {
      background: rgba(44, 107, 237, 0.3);
      border-radius: 3px;
    }

    .result-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(44, 107, 237, 0.5);
    }

    .summary-card {
      background: linear-gradient(135deg, #2c6bed 0%, #5b8cff 100%);
      border-radius: 14px;
      padding: 14px;
      color: white;
      box-shadow: 0 12px 20px rgba(44,107,237,0.2);
    }

    .summary-card h3 {
      margin: 0 0 10px;
      font-size: 0.85rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item strong {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .result-total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .result-total strong {
      font-size: clamp(1.2rem, 1.8vw, 1.6rem);
      color: #fbe29d;
    }

    .status-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: rgba(44,107,237,0.08);
      border-radius: 999px;
      font-size: 11px;
      color: var(--primary);
      font-weight: 700;
      border: 1px solid rgba(44,107,237,0.08);
    }

    .status-pill.good {
      background: rgba(31,157,97,0.08);
      color: var(--good);
      border-color: rgba(31,157,97,0.12);
    }

    .status-pill.bad {
      background: rgba(223,93,93,0.08);
      color: var(--bad);
      border-color: rgba(223,93,93,0.12);
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
      padding: 2px 0;
    }

    .value-positive {
      color: #d9f9eb;
    }

    .value-negative {
      color: #ffe1e1;
    }

    @media (max-width: 1200px) {
      .content {
        grid-template-columns: 1fr;
      }

      .result-panel {
        max-height: 250px;
      }
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 10px 14px;
      }

      h1 {
        font-size: 1rem;
      }

      .content {
        padding: 10px;
        gap: 10px;
      }

      .panel {
        padding: 10px;
        gap: 8px;
      }

      .chart-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .control-group {
        flex-direction: column;
      }

      select {
        width: 100%;
        min-width: auto;
      }

      .row {
        gap: 8px;
      }

      form {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title-wrap">
        <div class="icon" title="人民币美元换汇差额计算器">¥$</div>
        <h1>换汇差额计算器</h1>
      </div>
      <span class="badge">📡 实时汇率</span>
    </div>

    <div class="content">
      <div>
        <div class="panel chart-panel">
          <div class="chart-header">
            <h2>📈 汇率走势</h2>
            <span class="rate-badge" id="latestRate">加载中…</span>
          </div>

          <div class="chart-controls">
            <div class="control-group">
              <label for="currencyPair">货币对</label>
              <select id="currencyPair">
                <option value="USD_CNY" selected>美元/人民币</option>
                <option value="EUR_CNY">欧元/人民币</option>
                <option value="GBP_CNY">英镑/人民币</option>
                <option value="JPY_CNY">日元/人民币</option>
                <option value="EUR_USD">欧元/美元</option>
                <option value="GBP_USD">英镑/美元</option>
              </select>
            </div>
            <div class="control-group">
              <label for="timePeriod">周期</label>
              <select id="timePeriod">
                <option value="1">1 日</option>
                <option value="7">7 日</option>
                <option value="30" selected>30 日</option>
                <option value="90">3 月</option>
                <option value="365">1 年</option>
                <option value="1825">5 年</option>
              </select>
            </div>
          </div>

          <div class="chart-box">
            <div class="chart-container">
              <canvas id="exchangeChart"></canvas>
              <div class="chart-tooltip" id="chartTooltip"></div>
            </div>
            <div class="chart-loading" id="chartLoading">正在加载数据…</div>
          </div>
        </div>

        <form style="margin-top: 10px;">
          <div class="field-group">
            <label for="principal">本金</label>
            <input type="number" id="principal" value="10000" min="0" step="100" placeholder="金额">
          </div>

          <div class="row">
            <div class="field-group">
              <label for="rateA">汇率 A</label>
              <input type="number" id="rateA" value="6.66" min="0.01" step="0.01" placeholder="汇率">
            </div>
            <div class="field-group">
              <label for="rateB">汇率 B</label>
              <input type="number" id="rateB" value="6.67" min="0.01" step="0.01" placeholder="汇率">
            </div>
          </div>
        </form>
      </div>

      <div class="result-panel">
        <div class="summary-card">
          <h3>💰 换汇结果</h3>

          <div class="result-item">
            <span>汇率 A</span>
            <strong id="resultA">$0.00</strong>
          </div>

          <div class="result-item">
            <span>汇率 B</span>
            <strong id="resultB">$0.00</strong>
          </div>

          <div class="result-total">
            <span>差额</span>
            <strong id="difference">$0.00</strong>
          </div>
        </div>

        <div class="status-row">
          <span class="status-pill" id="betterOption">方案：待计算</span>
        </div>

        <p class="note">
          <strong>说明：</strong>汇率越大，目标货币越贵；换得越少。<br>
          <strong>公式：</strong>目标货币 = 源货币 ÷ 汇率。
        </p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const principalEl = document.getElementById('principal');
      const rateAEl = document.getElementById('rateA');
      const rateBEl = document.getElementById('rateB');
      const resultAEl = document.getElementById('resultA');
      const resultBEl = document.getElementById('resultB');
      const diffEl = document.getElementById('difference');
      const betterOptionEl = document.getElementById('betterOption');
      const currencyPairEl = document.getElementById('currencyPair');
      const timePeriodEl = document.getElementById('timePeriod');
      const chartLoadingEl = document.getElementById('chartLoading');
      const latestRateEl = document.getElementById('latestRate');
      const chartTooltipEl = document.getElementById('chartTooltip');

      let chartInstance = null;

      const currencyMap = {
        USD_CNY: { base: 'USD', target: 'CNY', name: 'USD/CNY', symbol: '$' },
        EUR_CNY: { base: 'EUR', target: 'CNY', name: 'EUR/CNY', symbol: '€' },
        GBP_CNY: { base: 'GBP', target: 'CNY', name: 'GBP/CNY', symbol: '£' },
        JPY_CNY: { base: 'JPY', target: 'CNY', name: 'JPY/CNY', symbol: '¥' },
        EUR_USD: { base: 'EUR', target: 'USD', name: 'EUR/USD', symbol: '€' },
        GBP_USD: { base: 'GBP', target: 'USD', name: 'GBP/USD', symbol: '£' },
      };

      function formatCurrency(value, currencyPair) {
        const { target } = currencyMap[currencyPair];
        const symbol = target === 'CNY' ? '¥' : target === 'USD' ? '$' : target;
        return symbol + Number(value || 0).toFixed(2);
      }

      function calculate() {
        const principal = parseFloat(principalEl.value) || 0;
        const rateA = parseFloat(rateAEl.value) || 0;
        const rateB = parseFloat(rateBEl.value) || 0;

        const usdA = rateA > 0 ? principal / rateA : 0;
        const usdB = rateB > 0 ? principal / rateB : 0;
        const diff = usdA - usdB;

        const currencyPair = currencyPairEl.value;
        resultAEl.textContent = formatCurrency(usdA, currencyPair);
        resultBEl.textContent = formatCurrency(usdB, currencyPair);

        if (Math.abs(diff) < 0.001) {
          diffEl.textContent = formatCurrency(0, currencyPair);
          diffEl.className = 'value';
          betterOptionEl.textContent = '✓ 相同';
          betterOptionEl.className = 'status-pill';
        } else {
          const absDiff = Math.abs(diff);
          const directionText = diff > 0 ? 'A 优' : 'B 优';
          diffEl.textContent = formatCurrency(absDiff, currencyPair);
          diffEl.className = diff > 0 ? 'value-positive' : 'value-negative';
          betterOptionEl.textContent = '🎯 ' + directionText;
          betterOptionEl.className = 'status-pill ' + (diff > 0 ? 'good' : 'bad');
        }
      }

      function formatDate(date) {
        return date.toISOString().slice(0, 10);
      }

      async function fetchExchangeRates() {
        try {
          const currencyPair = currencyPairEl.value;
          const days = parseInt(timePeriodEl.value);
          const { base, target, name } = currencyMap[currencyPair];

          const end = new Date();
          end.setHours(0, 0, 0, 0);
          const start = new Date(end);
          start.setDate(start.getDate() - days);

          chartLoadingEl.style.display = 'grid';
          chartLoadingEl.textContent = `📊 加载 ${name} 数据中...`;

          const url = `https://api.frankfurter.dev/v1/${formatDate(start)}..${formatDate(end)}?base=${base}&symbols=${target}`;

          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          if (!data.rates || Object.keys(data.rates).length === 0) {
            throw new Error('无可用数据');
          }

          const entries = Object.keys(data.rates).sort();
          const labels = [];
          const values = [];

          for (const date of entries) {
            const rate = data.rates[date]?.[target];
            if (rate) {
              labels.push(date);
              values.push(rate);
            }
          }

          if (values.length === 0) {
            throw new Error('解析失败');
          }

          renderChart(labels, values, currencyPair);
          const latestRate = values[values.length - 1];
          latestRateEl.textContent = `最新: 1${base}=${latestRate.toFixed(4)}${target}`;
          chartLoadingEl.style.display = 'none';
        } catch (err) {
          console.error('Error:', err);
          chartLoadingEl.textContent = `❌ 加载失败`;
          chartLoadingEl.style.display = 'grid';
        }
      }

      function renderChart(labels, values, currencyPair) {
        const { base, target } = currencyMap[currencyPair];
        const ctx = document.getElementById('exchangeChart');
        if (!ctx) return;

        const context = ctx.getContext('2d');

        if (chartInstance) {
          chartInstance.destroy();
        }

        const displayLabels = labels.map((label, idx) => {
          const interval = Math.max(1, Math.floor(labels.length / 8));
          return idx % interval === 0 ? label : '';
        });

        chartInstance = new Chart(context, {
          type: 'line',
          data: {
            labels: displayLabels,
            datasets: [{
              label: `${base}/${target}`,
              data: values,
              borderColor: '#2c6bed',
              backgroundColor: 'rgba(44, 107, 237, 0.1)',
              borderWidth: 2.5,
              fill: true,
              tension: 0.3,
              pointRadius: 0,
              pointHoverRadius: 5,
              pointHoverBackgroundColor: '#5b8cff',
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'index',
              intersect: false,
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                enabled: true,
                backgroundColor: 'rgba(29, 36, 51, 0.95)',
                titleColor: '#fff',
                bodyColor: '#fff',
                borderColor: 'rgba(44, 107, 237, 0.4)',
                borderWidth: 1,
                padding: 8,
                displayColors: false,
                titleFont: { weight: '700', size: 12 },
                bodyFont: { size: 11 },
                callbacks: {
                  title: function(context) {
                    return context[0].label || '';
                  },
                  label: function(context) {
                    return `${base}/${target}: ${context.parsed.y.toFixed(4)}`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: false,
                grid: {
                  color: 'rgba(95, 120, 170, 0.06)',
                  drawBorder: false,
                },
                ticks: {
                  color: '#7f8aa0',
                  font: { size: 10 },
                  callback: function(value) {
                    return value.toFixed(2);
                  }
                }
              },
              x: {
                grid: {
                  display: false,
                  drawBorder: false,
                },
                ticks: {
                  color: '#7f8aa0',
                  font: { size: 10 },
                }
              }
            }
          }
        });
      }

      // Event listeners
      principalEl.addEventListener('input', calculate);
      rateAEl.addEventListener('input', calculate);
      rateBEl.addEventListener('input', calculate);
      
      currencyPairEl.addEventListener('change', () => {
        calculate();
        fetchExchangeRates();
      });
      
      timePeriodEl.addEventListener('change', fetchExchangeRates);

      // Initial render
      calculate();
      setTimeout(fetchExchangeRates, 100);
    })();
  </script>
</body>
</html>
