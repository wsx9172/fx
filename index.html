<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FX Flow — 汇率与换汇差额</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b1320'/><rect x='12' y='12' width='76' height='76' rx='12' fill='none' stroke='%233aa0ff' stroke-width='4'/><text x='50' y='60' text-anchor='middle' dominant-baseline='middle' font-size='48' fill='%235ad4ff' font-weight='bold'>¥$</text></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #071521;
      --bg-2: #0d1b2a;
      --panel: rgba(13, 27, 42, 0.92);
      --panel-strong: rgba(18, 34, 52, 0.95);
      --panel-alt: rgba(14, 25, 38, 0.9);
      --muted: #8aa0b7;
      --text: #edf6ff;
      --line: rgba(150, 175, 212, 0.2);
      --primary: #3aa0ff;
      --primary-2: #5ad4ff;
      --success: #1bc98e;
      --danger: #ff5c7a;
      --warning: #f6c453;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(58,160,255,0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(90,212,255,0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
    }

    .page {
      width: 100%;
      height: 100vh;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      background: rgba(5, 14, 22, 0.8);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 19, 32, 0.95);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(58,160,255,0.25), rgba(90,212,255,0.18));
      border: 1px solid rgba(90,212,255,0.2);
      box-shadow: 0 10px 24px rgba(58,160,255,0.2);
      font-size: 18px;
      font-weight: 700;
      color: #dff6ff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .brand-mark:hover {
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 14px 28px rgba(58,160,255,0.26);
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-label {
      white-space: nowrap;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .brand-title {
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(27, 201, 142, 0.1);
      border: 1px solid rgba(27, 201, 142, 0.2);
      color: var(--success);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(340px, 0.85fr);
      gap: 14px;
      padding: 14px;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      background: linear-gradient(180deg, rgba(17,31,47,0.9), rgba(10,18,28,0.95));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .chart-panel {
      padding: 14px;
      min-height: 0;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 0 12px 0;
      flex-wrap: wrap;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      box-shadow: 0 0 18px rgba(58,160,255,0.8);
    }

    .chart-title h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .currency-pair-select {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .chart-pair-select {
      appearance: none;
      border: 1px solid rgba(90, 212, 255, 0.3);
      background: rgba(9, 24, 40, 0.6);
      color: var(--primary-2);
      font-size: 11px;
      border-radius: 6px;
      padding: 6px 24px 6px 10px;
      outline: none;
      min-width: 120px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
    }

    .chart-pair-select:hover {
      background: rgba(9, 24, 40, 0.8);
      border-color: rgba(90, 212, 255, 0.5);
    }

    .chart-pair-select:focus {
      background: rgba(9, 24, 40, 0.8);
      border-color: rgba(90, 212, 255, 0.7);
      box-shadow: 0 0 0 2px rgba(58, 160, 255, 0.1);
    }

    .chart-pair-select option {
      background: #0d1b2a;
      color: #edf6ff;
      padding: 6px;
    }

    .currency-pair-select::after {
      content: '▼';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: rgba(90,212,255,0.6);
      pointer-events: none;
    }

    .chart-toolbox {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .meta-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 32px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      background: rgba(255,255,255,0.02);
    }

    .meta-chip strong {
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
    }

    .period-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .period-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
    }

    .period-btn.active {
      background: linear-gradient(135deg, rgba(58,160,255,0.18), rgba(90,212,255,0.08));
      border-color: rgba(90,212,255,0.35);
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(90,212,255,0.08);
    }

    .period-btn:hover {
      border-color: rgba(90,212,255,0.25);
      color: var(--text);
    }

    .chart-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: rgba(8, 17, 27, 0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 8px 8px;
      overflow: hidden;
    }

    #exchangeChart {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chart-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8,17,27,0.18);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 18px;
      pointer-events: none;
    }

    .panel.calc {
      padding: 14px;
      overflow: hidden;
    }

    .calc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .calc-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      font-size: 10px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
    }

    .calc-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .number-input-wrapper {
      position: relative;
    }

    .field-group input[type="number"] {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(133, 157, 191, 0.25);
      background: rgba(9, 17, 27, 0.7);
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .field-group input[type="number"]::-webkit-outer-spin-button,
    .field-group input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field-group input[type="number"][type="number"] {
      -moz-appearance: textfield;
    }

    .field-group input[type="number"]:focus {
      border-color: rgba(58,160,255,0.8);
      box-shadow: 0 0 0 3px rgba(58,160,255,0.12);
      transform: translateY(-1px);
    }

    .number-input-wrapper::after,
    .number-input-wrapper::before {
      content: '';
      position: absolute;
      right: 10px;
      width: 6px;
      height: 6px;
      border-style: solid;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .number-input-wrapper::before {
      top: 7px;
      border-width: 0 3px 4px 3px;
      border-color: transparent transparent rgba(90, 212, 255, 0.8) transparent;
    }

    .number-input-wrapper::after {
      bottom: 7px;
      border-width: 4px 3px 0 3px;
      border-color: rgba(90, 212, 255, 0.8) transparent transparent transparent;
    }

    .number-input-wrapper:hover::before,
    .number-input-wrapper:hover::after {
      opacity: 1;
    }

    /* ===== 修复：让数字输入框的箭头可以点击 ===== */
    .number-input-wrapper::before,
    .number-input-wrapper::after {
      pointer-events: auto;
      cursor: pointer;
      z-index: 2;
    }

    /* 给箭头留出足够的点击热区 */
    .number-input-wrapper {
      --arrow-zone: 26px;
    }

    .field-group input[type="number"] {
      padding-right: 28px;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .result-card {
      background: linear-gradient(135deg, rgba(58,160,255,0.12), rgba(90,212,255,0.06));
      border: 1px solid rgba(90,212,255,0.18);
      border-radius: 12px;
      padding: 10px;
      margin-top: 2px;
    }

    .result-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
      color: var(--muted);
    }

    .result-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .result-line strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .result-main {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.09);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .result-main strong {
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      color: var(--warning);
      letter-spacing: 0.04em;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .page {
        height: auto;
        min-height: 100vh;
      }

      body {
        overflow: auto;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 12px 14px;
      }

      .brand-title {
        font-size: 1rem;
      }

      .workspace {
        padding: 10px;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .chart-header {
        align-items: flex-start;
      }

      .chart-toolbox {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" title="FX Flow">¥$</div>
        <div class="brand-copy">
          <div class="brand-label">Market desk</div>
          <div class="brand-title">FX Flow</div>
        </div>
      </div>

      <div class="topbar-controls">
        <span class="status-pill">● LIVE</span>
      </div>
    </header>

    <main class="workspace">
      <section class="panel chart-panel">
        <div class="chart-header">
          <div class="chart-title">
            <span class="dot"></span>
            <h2>汇率走势</h2>
          </div>
          <div class="currency-pair-select">
            <select id="currencyPair" class="chart-pair-select" aria-label="请选择货币对">
              <option value="USD_CNY" selected>USD/CNY</option>
              <option value="EUR_CNY">EUR/CNY</option>
              <option value="GBP_CNY">GBP/CNY</option>
              <option value="JPY_CNY">JPY/CNY</option>
              <option value="EUR_USD">EUR/USD</option>
              <option value="GBP_USD">GBP/USD</option>
            </select>
          </div>
        </div>

        <div class="chart-toolbox">
          <div class="meta-strip">
            <div class="meta-chip">最新 <strong id="metaLatest">--</strong></div>
            <div class="meta-chip">开盘 <strong id="metaOpen">--</strong></div>
            <div class="meta-chip">最高 <strong id="metaHigh">--</strong></div>
            <div class="meta-chip">最低 <strong id="metaLow">--</strong></div>
          </div>

          <div class="period-picker" aria-label="选择时间周期">
            <button class="period-btn" data-period="7">7D</button>
            <button class="period-btn" data-period="30">1M</button>
            <button class="period-btn active" data-period="90">3M</button>
            <button class="period-btn" data-period="365">1Y</button>
            <button class="period-btn" data-period="1825">5Y</button>
            <button class="period-btn" data-period="18250">MAX</button>
          </div>
        </div>

        <div class="chart-wrap">
          <canvas id="exchangeChart"></canvas>
          <div class="chart-overlay" id="chartOverlay">加载中…</div>
        </div>
      </section>

      <aside class="panel calc">
        <div class="calc-header">
          <div class="calc-title">换汇计算器</div>
          <span class="mini-pill">风险检测</span>
        </div>

        <div class="calc-body">
          <div class="field-group">
            <label for="principal">本金</label>
            <div class="number-input-wrapper">
              <input id="principal" type="number" value="10000" min="0" step="100" placeholder="请输入金额">
            </div>
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="rateA">汇率 A</label>
              <div class="number-input-wrapper">
                <input id="rateA" type="number" value="6.66" min="0.01" step="0.01" placeholder="例如 6.66">
              </div>
            </div>
            <div class="field-group">
              <label for="rateB">汇率 B</label>
              <div class="number-input-wrapper">
                <input id="rateB" type="number" value="6.67" min="0.01" step="0.01" placeholder="例如 6.67">
              </div>
            </div>
          </div>

          <div class="result-card">
            <div class="result-line">
              <span>按汇率 A 换得</span>
              <strong id="resultA">--</strong>
            </div>
            <div class="result-line">
              <span>按汇率 B 换得</span>
              <strong id="resultB">--</strong>
            </div>
            <div class="result-main">
              <span>差额</span>
              <strong id="difference">--</strong>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      const currencyPairEl = document.getElementById('currencyPair');
      const principalEl = document.getElementById('principal');
      const rateAEl = document.getElementById('rateA');
      const rateBEl = document.getElementById('rateB');
      const resultAEl = document.getElementById('resultA');
      const resultBEl = document.getElementById('resultB');
      const diffEl = document.getElementById('difference');
      const metaLatestEl = document.getElementById('metaLatest');
      const metaOpenEl = document.getElementById('metaOpen');
      const metaHighEl = document.getElementById('metaHigh');
      const metaLowEl = document.getElementById('metaLow');
      const chartOverlayEl = document.getElementById('chartOverlay');

      const currencyMap = {
        USD_CNY: { base: 'USD', target: 'CNY', label: 'USD/CNY' },
        EUR_CNY: { base: 'EUR', target: 'CNY', label: 'EUR/CNY' },
        GBP_CNY: { base: 'GBP', target: 'CNY', label: 'GBP/CNY' },
        JPY_CNY: { base: 'JPY', target: 'CNY', label: 'JPY/CNY' },
        EUR_USD: { base: 'EUR', target: 'USD', label: 'EUR/USD' },
        GBP_USD: { base: 'GBP', target: 'USD', label: 'GBP/USD' }
      };

      const periodButtons = Array.from(document.querySelectorAll('.period-btn'));
      let chartInstance = null;

      function formatNumber(value) {
        return Number(value || 0).toFixed(2);
      }

      function calculate() {
        const principal = parseFloat(principalEl.value) || 0;
        const rateA = parseFloat(rateAEl.value) || 0;
        const rateB = parseFloat(rateBEl.value) || 0;
        const resultA = rateA > 0 ? principal / rateA : 0;
        const resultB = rateB > 0 ? principal / rateB : 0;
        const diff = resultA - resultB;

        resultAEl.textContent = formatNumber(resultA);
        resultBEl.textContent = formatNumber(resultB);
        diffEl.textContent = formatNumber(Math.abs(diff));
      }

      function setPeriodActive(value) {
        periodButtons.forEach((button) => {
          button.classList.toggle('active', String(button.dataset.period) === String(value));
        });
      }

      function formatDate(date) {
        return date.toISOString().slice(0, 10);
      }

      function formatDateLabel(date, days) {
        if (days <= 90) {
          return date.slice(5);
        } else if (days <= 365) {
          return date.slice(0, 7);
        } else {
          return date.slice(0, 4);
        }
      }

      async function fetchRates() {
        const pairKey = currencyPairEl.value;
        const pair = currencyMap[pairKey];
        const days = Number(document.querySelector('.period-btn.active')?.dataset.period || 90);
        const end = new Date();
        end.setHours(0, 0, 0, 0);
        const start = new Date(end);
        start.setDate(start.getDate() - days);

        const url = `https://api.frankfurter.dev/v1/${formatDate(start)}..${formatDate(end)}?base=${pair.base}&symbols=${pair.target}`;

        chartOverlayEl.style.display = 'flex';
        chartOverlayEl.textContent = '加载汇率数据…';

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('网络或数据错误');
          const data = await response.json();

          if (!data.rates || Object.keys(data.rates).length === 0) {
            throw new Error('暂无汇率数据');
          }

          const labels = [];
          const values = [];

          Object.keys(data.rates).sort().forEach((date) => {
            const value = data.rates[date]?.[pair.target];
            if (value) {
              labels.push(formatDateLabel(date, days));
              values.push(value);
            }
          });

          if (!values.length) {
            throw new Error('无有效汇率');
          }

          renderChart(labels, values, pairKey);

          const latestValue = values[values.length - 1];
          const firstValue = values[0];
          const maxValue = Math.max(...values);
          const minValue = Math.min(...values);

          metaLatestEl.textContent = latestValue.toFixed(4);
          metaOpenEl.textContent = firstValue.toFixed(4);
          metaHighEl.textContent = maxValue.toFixed(4);
          metaLowEl.textContent = minValue.toFixed(4);
          chartOverlayEl.style.display = 'none';
        } catch (err) {
          console.error(err);
          chartOverlayEl.textContent = '数据加载失败';
          chartOverlayEl.style.display = 'flex';
        }
      }

      function renderChart(labels, values, pairKey) {
        const pair = currencyMap[pairKey];
        const ctx = document.getElementById('exchangeChart').getContext('2d');

        if (chartInstance) {
          chartInstance.destroy();
        }

        const displayLabels = labels.map((label, idx) => {
          const step = Math.max(1, Math.ceil(labels.length / 8));
          return idx % step === 0 ? label : '';
        });

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: displayLabels,
            datasets: [{
              label: `${pair.base}/${pair.target}`,
              data: values,
              borderColor: '#5ad4ff',
              pointBackgroundColor: '#5ad4ff',
              pointBorderColor: '#071521',
              pointBorderWidth: 1,
              pointRadius: 0,
              pointHoverRadius: 4,
              backgroundColor: 'rgba(90, 212, 255, 0.12)',
              borderWidth: 2.5,
              fill: true,
              tension: 0.38,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'index',
              intersect: false,
            },
            animation: {
              duration: 450,
              easing: 'easeOutQuart'
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: 'rgba(7, 21, 33, 0.94)',
                titleColor: '#edf6ff',
                bodyColor: '#ecf5ff',
                padding: 10,
                borderColor: 'rgba(90,212,255,0.25)',
                borderWidth: 1,
                displayColors: false,
                callbacks: {
                  title: function(items) {
                    const item = items[0];
                    return item.label ? item.label : '';
                  },
                  label: function(context) {
                    return `${pair.base}/${pair.target}: ${context.parsed.y.toFixed(4)}`;
                  }
                }
              }
            },
            scales: {
              x: {
                grid: {
                  display: false,
                  drawBorder: false,
                },
                ticks: {
                  color: '#8aa0b7',
                  font: { size: 10 },
                  maxRotation: 0,
                  autoSkip: true,
                  maxTicksLimit: 8,
                },
                border: {
                  display: false
                }
              },
              y: {
                grid: {
                  color: 'rgba(138,160,183,0.1)',
                  drawBorder: false,
                },
                ticks: {
                  color: '#8aa0b7',
                  font: { size: 10 },
                  callback: function(value) {
                    return Number(value).toFixed(2);
                  }
                },
                border: {
                  display: false
                }
              }
            }
          }
        });
      }

      /* ===== 修复：数字输入框箭头点击步进 ===== */
      const ARROW_ZONE = 26;    // 右侧箭头点击热区宽度（px）
      const HOLD_DELAY = 350;   // 长按多久开始连续步进（ms）
      const HOLD_SPEED = 60;    // 连续步进间隔（ms）

      function getStep(input) {
        const step = parseFloat(input.step);
        return Number.isFinite(step) && step > 0 ? step : 1;
      }

      function adjustValue(input, direction) {
        const step = getStep(input);
        const current = parseFloat(input.value);
        let next = (Number.isFinite(current) ? current : 0) + direction * step;

        const min = parseFloat(input.min);
        const max = parseFloat(input.max);
        if (Number.isFinite(min)) next = Math.max(min, next);
        if (Number.isFinite(max)) next = Math.min(max, next);

        const decimals = (String(step).split('.')[1] || '').length;
        next = decimals > 0 ? Number(next.toFixed(decimals)) : Math.round(next);

        const nextStr = String(next);
        if (nextStr === input.value) return;

        input.value = nextStr;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }

      document.querySelectorAll('.number-input-wrapper').forEach((wrapper) => {
        const input = wrapper.querySelector('input[type="number"]');
        if (!input) return;

        let holdTimer = null;
        let repeatTimer = null;

        const stopHold = () => {
          window.clearTimeout(holdTimer);
          window.clearInterval(repeatTimer);
          holdTimer = null;
          repeatTimer = null;
        };

        const startHold = (direction) => {
          stopHold();
          holdTimer = window.setTimeout(() => {
            repeatTimer = window.setInterval(() => adjustValue(input, direction), HOLD_SPEED);
          }, HOLD_DELAY);
        };

        wrapper.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;

          const rect = wrapper.getBoundingClientRect();
          const offsetX = event.clientX - rect.left;
          if (offsetX < rect.width - ARROW_ZONE) return; // 不在箭头区域，交给输入框自身

          event.preventDefault();
          input.focus();

          const direction = (event.clientY - rect.top) < rect.height / 2 ? 1 : -1;
          adjustValue(input, direction);
          startHold(direction);
        });

        window.addEventListener('pointerup', stopHold);
        window.addEventListener('pointercancel', stopHold);
        window.addEventListener('blur', stopHold);
        wrapper.addEventListener('pointerleave', stopHold);
      });

      currencyPairEl.addEventListener('change', function () {
        fetchRates();
        calculate();
      });

      principalEl.addEventListener('input', calculate);
      rateAEl.addEventListener('input', calculate);
      rateBEl.addEventListener('input', calculate);

      periodButtons.forEach((button) => {
        button.addEventListener('click', function () {
          setPeriodActive(this.dataset.period);
          fetchRates();
        });
      });

      calculate();
      setPeriodActive(90);
      fetchRates();
    })();
  </script>
</body>
</html>
